name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  decoder-test:
    name: host decoder test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the golden-output test
        run: make test

      - name: Compiler warnings must stay clean
        run: |
          # The build already uses -Wall -Wextra; fail the job if any warning
          # slips in by rebuilding with -Werror.
          make clean
          make test HOST_CC="cc -Werror"
